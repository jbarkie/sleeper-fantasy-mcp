EXCLUDED_LEAGUES = "1389708735164723200"

# MCP_PATH_TOKEN is a secret: `wrangler secret put MCP_PATH_TOKEN` (local dev reads .dev.vars).

[[kv_namespaces]]
binding = "CACHE"
id = "7b58b960fb4940e08f40501249135347"
