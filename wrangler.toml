name = "sleeper-fantasy-mcp"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[vars]
SLEEPER_USERNAME = "jbarkie"
# Comma-separated league IDs to ignore. 1389708735164723200 = Progressive Fantasy Football (inactive).
EXCLUDED_LEAGUES = "1389708735164723200"
# ESPN league ids (comma-separated). ESPN tools register only when ESPN_S2 and ESPN_SWID
# secrets are also set. 2077966273 = "Advanced fantasy" (private).
ESPN_LEAGUES = "2077966273"

# MCP_PATH_TOKEN, ESPN_S2 and ESPN_SWID are secrets: `wrangler secret put <NAME>` (local dev reads .dev.vars).

[[kv_namespaces]]
binding = "CACHE"
id = "7b58b960fb4940e08f40501249135347"

